# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set API base URL based on target branch
        id: vars
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "api_base_url=https://exury-backend-production.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            echo "api_base_url=https://exury-backend-develop.up.railway.app" >> "$GITHUB_OUTPUT"
          fi

      - run: yarn install --frozen-lockfile && yarn build && ls -la dist/assets/
        env:
          VITE_API_BASE_URL: ${{ steps.vars.outputs.api_base_url }}
          VITE_INVEST_LEADS_EMAIL: ${{ secrets.VITE_INVEST_LEADS_EMAIL }}
          VITE_SCHEDULING_URL: ${{ secrets.VITE_SCHEDULING_URL }}
          VITE_BANK_BENEFICIARY: ${{ secrets.VITE_BANK_BENEFICIARY }}
          VITE_BANK_IBAN: ${{ secrets.VITE_BANK_IBAN }}
          VITE_BANK_NAME: ${{ secrets.VITE_BANK_NAME }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_REDIRECT_URI: ${{ secrets.VITE_AUTH0_REDIRECT_URI }}
          VITE_EXURY_USDC_WALLET_BSC: ${{ secrets.VITE_EXURY_USDC_WALLET_BSC }}
          VITE_EXURY_USDC_WALLET_SOL: ${{ secrets.VITE_EXURY_USDC_WALLET_SOL }}
          VITE_EXURY_USDC_WALLET_ETH: ${{ secrets.VITE_EXURY_USDC_WALLET_ETH }}
          VITE_EXURY_USDC_WALLET_POL: ${{ secrets.VITE_EXURY_USDC_WALLET_POL }}
          VITE_EXURY_USDC_WALLET_ALGO: ${{ secrets.VITE_EXURY_USDC_WALLET_ALGO }}
          VITE_EXURY_USDC_WALLET_AVAXC: ${{ secrets.VITE_EXURY_USDC_WALLET_AVAXC }}
          VITE_EXURY_BTC_WALLET_BSC: ${{ secrets.VITE_EXURY_BTC_WALLET_BSC }}
          VITE_EXURY_BTC_WALLET_ETH: ${{ secrets.VITE_EXURY_BTC_WALLET_ETH }}
          VITE_EXURY_BTC_WALLET_SEGWIT: ${{ secrets.VITE_EXURY_BTC_WALLET_SEGWIT }}
          VITE_EXURY_ETH_WALLET_BSC: ${{ secrets.VITE_EXURY_ETH_WALLET_BSC }}
          VITE_EXURY_ETH_WALLET_ETH: ${{ secrets.VITE_EXURY_ETH_WALLET_ETH }}
          VITE_EXURY_ETH_WALLET_ARBITRUM: ${{ secrets.VITE_EXURY_ETH_WALLET_ARBITRUM }}
          VITE_EXURY_ETH_WALLET_BASE: ${{ secrets.VITE_EXURY_ETH_WALLET_BASE }}
          VITE_EXURY_BNB_WALLET_BSC: ${{ secrets.VITE_EXURY_BNB_WALLET_BSC }}

      - name: Deploy preview channel (with controlled error handling)
        id: deploy
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXURYDEV }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "${RUNNER_TEMP}/gcp-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/gcp-key.json"

          CHANNEL_ID="pr${{ github.event.pull_request.number }}-${{ github.head_ref }}"
          CHANNEL_ID=$(echo "$CHANNEL_ID" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-63)

          npx firebase-tools@latest hosting:channel:deploy "$CHANNEL_ID" \
            --expires 7d \
            --project exurydev \
            2>&1 | tee "${RUNNER_TEMP}/deploy.log"

          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Evaluate deploy outcome
        if: steps.deploy.outcome == 'failure'
        run: |
          LOG="${RUNNER_TEMP}/deploy.log"
          if grep -qi "is the current active version" "$LOG"; then
            echo "::warning::El contenido ya estaba publicado como la versión activa del canal. No hay cambios que desplegar; se trata como éxito."
            exit 0
          else
            echo "::error::El deploy a Firebase Hosting falló por un motivo real. Revisa el log anterior."
            exit 1
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gcp-key.json"